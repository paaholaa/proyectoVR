<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

  <title>Visor VR 360°</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: black;

      font-family: Arial, sans-serif;

    }


    canvas {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      display: block;

      z-index: 1;

    }


    /* ==========================================
       MÁSCARA VR
    ========================================== */

    #vr-mask {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      z-index: 10;

      pointer-events: none;

    }


    /*
       Cada mitad corresponde
       a uno de los ojos.
    */

    .eye-mask {

      position: absolute;

      top: 0;

      width: 50%;
      height: 100%;

      overflow: hidden;

    }


    /* MITAD IZQUIERDA */

    #eye-left {

      left: 0;

    }


    /* MITAD DERECHA */

    #eye-right {

      right: 0;

    }


    /* ==========================================
       FORMA CIRCULAR DE LOS LENTES
    ========================================== */

    .eye-mask::after {

      content: "";

      position: absolute;

      top: 50%;

      /*
         Tamaño del círculo.
      */

      width: min(48vw, 92vh);
      height: min(48vw, 92vh);

      transform: translateY(-50%);

      border-radius: 50%;

      /*
         Todo lo que está fuera
         del círculo queda negro.
      */

      box-shadow:
        0 0 0 200vmax black;

    }


    /* ==========================================
       OJO IZQUIERDO

       Lo pegamos al centro.
    ========================================== */

    #eye-left::after {

      right: 0;

    }


    /* ==========================================
       OJO DERECHO

       Lo pegamos al centro.
    ========================================== */

    #eye-right::after {

      left: 0;

    }


    /* ==========================================
       BOTÓN INICIAR VR
    ========================================== */

    #start-btn {

      position: fixed;

      left: 50%;
      bottom: 20px;

      transform:
        translateX(-50%);

      z-index: 100;

      padding:
        14px 26px;

      border: none;

      border-radius: 30px;

      background: #28a745;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 4px 15px
        rgba(0,0,0,0.8);

      white-space: nowrap;

    }


    /* ==========================================
       MENSAJE SUPERIOR
    ========================================== */

    #mensaje {

      position: fixed;

      top: 15px;
      left: 50%;

      transform:
        translateX(-50%);

      z-index: 100;

      padding:
        9px 18px;

      border-radius: 20px;

      background:
        rgba(0,0,0,0.7);

      color: white;

      font-size: 14px;

      text-align: center;

      white-space: nowrap;

    }


    /* ==========================================
       CELULAR HORIZONTAL
    ========================================== */

    @media (orientation: landscape) {

      .eye-mask::after {

        width:
          min(48vw, 92vh);

        height:
          min(48vw, 92vh);

      }

    }


    /* ==========================================
       CELULAR VERTICAL
    ========================================== */

    @media (orientation: portrait) {

      .eye-mask::after {

        width: 48vw;
        height: 48vw;

      }

    }

  </style>


  <!-- ==========================================
       THREE.JS
  ========================================== -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
  </script>


  <!-- ==========================================
       STEREO EFFECT
  ========================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/effects/StereoEffect.js">
  </script>

</head>


<body>


  <!-- ==========================================
       MÁSCARA DE LOS DOS LENTES
  ========================================== -->

  <div id="vr-mask">

    <div
      class="eye-mask"
      id="eye-left">
    </div>

    <div
      class="eye-mask"
      id="eye-right">
    </div>

  </div>


  <!-- ==========================================
       MENSAJE
  ========================================== -->

  <div id="mensaje">

    🥽 Visor VR 360°

  </div>


  <!-- ==========================================
       BOTÓN
  ========================================== -->

  <button id="start-btn">

    📱 Iniciar VR

  </button>


<script>


/* =====================================================
   COMPROBAR THREE.JS
===================================================== */

if (
  typeof THREE === "undefined"
) {

  alert(
    "No se pudo cargar Three.js"
  );

  throw new Error(
    "THREE no está disponible"
  );

}


/* =====================================================
   ESCENA
===================================================== */

const scene =
new THREE.Scene();


scene.background =
new THREE.Color(
  0x000000
);


/* =====================================================
   CÁMARA
===================================================== */

const camera =
new THREE.PerspectiveCamera(

  90,

  window.innerWidth /
  window.innerHeight,

  0.1,

  1000

);


camera.position.set(
  0,
  0,
  0
);


/* =====================================================
   RENDERIZADOR
===================================================== */

const renderer =
new THREE.WebGLRenderer({

  antialias: true

});


renderer.setPixelRatio(

  Math.min(

    window.devicePixelRatio,

    2

  )

);


renderer.setSize(

  window.innerWidth,

  window.innerHeight

);


renderer.setClearColor(

  0x000000,

  1

);


document.body.appendChild(

  renderer.domElement

);


/* =====================================================
   EFECTO ESTEREOSCÓPICO
===================================================== */

const effect =
new THREE.StereoEffect(
  renderer
);


effect.setSize(

  window.innerWidth,

  window.innerHeight

);


/* =====================================================
   CARGADOR DE IMÁGENES
===================================================== */

const loader =
new THREE.TextureLoader();


/* =====================================================
   FUNCIÓN PARA CARGAR IMÁGENES
===================================================== */

function cargarImagen(
  ruta,
  nombre
) {

  return loader.load(

    ruta,

    function() {

      console.log(
        "Imagen cargada:",
        nombre
      );

    },

    undefined,

    function(error) {

      console.error(
        "Error cargando:",
        ruta,
        error
      );

    }

  );

}


/* =====================================================
   CARGAR TUS 6 IMÁGENES
===================================================== */


/* DERECHA */

const texturaPosX =
cargarImagen(

  "fotos/posx.png",

  "Derecha"

);


/* IZQUIERDA */

const texturaNegX =
cargarImagen(

  "fotos/negx.png",

  "Izquierda"

);


/* ARRIBA */

const texturaPosY =
cargarImagen(

  "fotos/posy.png",

  "Arriba"

);


/* ABAJO */

const texturaNegY =
cargarImagen(

  "fotos/negy.png",

  "Abajo"

);


/* FRENTE */

const texturaPosZ =
cargarImagen(

  "fotos/posz.png",

  "Frente"

);


/* ATRÁS */

const texturaNegZ =
cargarImagen(

  "fotos/negz.png",

  "Atrás"

);


/* =====================================================
   MATERIALES
===================================================== */

const materials = [

  /* DERECHA */

  new THREE.MeshBasicMaterial({

    map:
      texturaPosX,

    side:
      THREE.BackSide

  }),


  /* IZQUIERDA */

  new THREE.MeshBasicMaterial({

    map:
      texturaNegX,

    side:
      THREE.BackSide

  }),


  /* ARRIBA */

  new THREE.MeshBasicMaterial({

    map:
      texturaPosY,

    side:
      THREE.BackSide

  }),


  /* ABAJO */

  new THREE.MeshBasicMaterial({

    map:
      texturaNegY,

    side:
      THREE.BackSide

  }),


  /* FRENTE */

  new THREE.MeshBasicMaterial({

    map:
      texturaPosZ,

    side:
      THREE.BackSide

  }),


  /* ATRÁS */

  new THREE.MeshBasicMaterial({

    map:
      texturaNegZ,

    side:
      THREE.BackSide

  })

];


/* =====================================================
   CREAR CUBO 360°
===================================================== */

const geometry =
new THREE.BoxGeometry(

  100,

  100,

  100

);


const skybox =
new THREE.Mesh(

  geometry,

  materials

);


scene.add(
  skybox
);


/* =====================================================
   VARIABLES MOUSE
===================================================== */

let mouseDown =
false;


let previousX =
0;


let previousY =
0;


let yaw =
0;


let pitch =
0;


/* =====================================================
   VARIABLES GIROSCOPIO
===================================================== */

let gyroActive =
false;


/* =====================================================
   MOUSE PRESIONADO
===================================================== */

document.addEventListener(

  "mousedown",

  function(event) {

    if (
      gyroActive
    ) {

      return;

    }


    mouseDown =
      true;


    previousX =
      event.clientX;


    previousY =
      event.clientY;

  }

);


/* =====================================================
   SOLTAR MOUSE
===================================================== */

document.addEventListener(

  "mouseup",

  function() {

    mouseDown =
      false;

  }

);


/* =====================================================
   MOVER MOUSE
===================================================== */

document.addEventListener(

  "mousemove",

  function(event) {

    if (

      !mouseDown

      ||

      gyroActive

    ) {

      return;

    }


    const deltaX =

      event.clientX -

      previousX;


    const deltaY =

      event.clientY -

      previousY;


    yaw -=

      deltaX *

      0.005;


    pitch -=

      deltaY *

      0.005;


    /*
       Limitar movimiento vertical
    */

    pitch =

      Math.max(

        -Math.PI / 2,

        Math.min(

          Math.PI / 2,

          pitch

        )

      );


    previousX =
      event.clientX;


    previousY =
      event.clientY;

  }

);


/* =====================================================
   TOUCH EN CELULAR
===================================================== */

let touchX =
0;


let touchY =
0;


document.addEventListener(

  "touchstart",

  function(event) {

    if (

      gyroActive

      ||

      event.touches.length === 0

    ) {

      return;

    }


    touchX =
      event.touches[0].clientX;


    touchY =
      event.touches[0].clientY;

  },

  {
    passive: true
  }

);


/* =====================================================
   MOVER CON DEDO
===================================================== */

document.addEventListener(

  "touchmove",

  function(event) {

    if (

      gyroActive

      ||

      event.touches.length === 0

    ) {

      return;

    }


    const x =
      event.touches[0].clientX;


    const y =
      event.touches[0].clientY;


    yaw -=

      (x - touchX) *

      0.005;


    pitch -=

      (y - touchY) *

      0.005;


    pitch =

      Math.max(

        -Math.PI / 2,

        Math.min(

          Math.PI / 2,

          pitch

        )

      );


    touchX =
      x;


    touchY =
      y;

  },

  {
    passive: true
  }

);


/* =====================================================
   GIROSCOPIO
===================================================== */

const deviceEuler =
new THREE.Euler();


const deviceQuaternion =
new THREE.Quaternion();


const screenQuaternion =
new THREE.Quaternion();


const worldQuaternion =
new THREE.Quaternion(

  -Math.sqrt(0.5),

  0,

  0,

  Math.sqrt(0.5)

);


const zee =
new THREE.Vector3(
  0,
  0,
  1
);


/* =====================================================
   CONVERTIR MOVIMIENTO DEL CELULAR
===================================================== */

function setObjectQuaternion(

  quaternion,

  alpha,

  beta,

  gamma,

  orient

) {


  deviceEuler.set(

    beta,

    alpha,

    -gamma,

    "YXZ"

  );


  quaternion.setFromEuler(
    deviceEuler
  );


  quaternion.multiply(
    worldQuaternion
  );


  quaternion.multiply(

    screenQuaternion
      .setFromAxisAngle(

        zee,

        -orient

      )

  );

}


/* =====================================================
   LEER GIROSCOPIO
===================================================== */

function onDeviceOrientation(
  event
) {


  if (

    event.alpha === null

    &&

    event.beta === null

    &&

    event.gamma === null

  ) {

    return;

  }


  gyroActive =
    true;


  const alpha =

    event.alpha !== null

    ?

    THREE.MathUtils.degToRad(
      event.alpha
    )

    :

    0;


  const beta =

    event.beta !== null

    ?

    THREE.MathUtils.degToRad(
      event.beta
    )

    :

    0;


  const gamma =

    event.gamma !== null

    ?

    THREE.MathUtils.degToRad(
      event.gamma
    )

    :

    0;


  let orientation =
    0;


  if (

    screen.orientation

    &&

    typeof screen.orientation.angle
    === "number"

  ) {


    orientation =

      THREE.MathUtils.degToRad(

        screen.orientation.angle

      );

  }


  else if (

    typeof window.orientation
    === "number"

  ) {


    orientation =

      THREE.MathUtils.degToRad(

        window.orientation

      );

  }


  setObjectQuaternion(

    deviceQuaternion,

    alpha,

    beta,

    gamma,

    orientation

  );


  camera.quaternion.copy(
    deviceQuaternion
  );

}


/* =====================================================
   BOTÓN INICIAR VR
===================================================== */

const btn =
document.getElementById(
  "start-btn"
);


const mensaje =
document.getElementById(
  "mensaje"
);


btn.addEventListener(

  "click",

  async function() {


    /* ============================
       IPHONE / IPAD
    ============================ */

    if (

      typeof DeviceOrientationEvent
      !== "undefined"

      &&

      typeof DeviceOrientationEvent
        .requestPermission
      === "function"

    ) {


      try {


        const permission =

          await DeviceOrientationEvent
            .requestPermission();


        if (

          permission ===
          "granted"

        ) {


          activarGiroscopio();


        }


        else {


          alert(

            "Debes permitir el acceso al movimiento."

          );


          return;

        }


      }


      catch(error) {


        console.error(
          error
        );


        alert(

          "No se pudo activar el giroscopio."

        );


        return;

      }

    }


    /* ============================
       ANDROID
    ============================ */

    else {


      activarGiroscopio();

    }


    /* ============================
       PANTALLA COMPLETA
    ============================ */

    try {


      if (

        document.documentElement
          .requestFullscreen

      ) {


        await document
          .documentElement
          .requestFullscreen();

      }


    }


    catch(error) {


      console.log(

        "Pantalla completa no disponible"

      );

    }

  }

);


/* =====================================================
   ACTIVAR GIROSCOPIO
===================================================== */

function activarGiroscopio() {


  window.addEventListener(

    "deviceorientation",

    onDeviceOrientation,

    true

  );


  btn.style.display =
    "none";


  mensaje.innerHTML =

    "🥽 Mueve el celular para mirar alrededor";


  setTimeout(

    function() {


      mensaje.style.display =
        "none";

    },

    2500

  );

}


/* =====================================================
   ROTACIÓN CON MOUSE
===================================================== */

const mouseEuler =
new THREE.Euler(

  0,

  0,

  0,

  "YXZ"

);


/* =====================================================
   ANIMACIÓN
===================================================== */

function animate() {


  requestAnimationFrame(
    animate
  );


  /*
     COMPUTADORA
  */

  if (
    !gyroActive
  ) {


    mouseEuler.set(

      pitch,

      yaw,

      0,

      "YXZ"

    );


    camera.quaternion
      .setFromEuler(

        mouseEuler

      );

  }


  /*
     DOS VISTAS VR
  */

  effect.render(

    scene,

    camera

  );

}


animate();


/* =====================================================
   AJUSTAR TAMAÑO
===================================================== */

function ajustarPantalla() {


  camera.aspect =

    window.innerWidth /

    window.innerHeight;


  camera.updateProjectionMatrix();


  renderer.setSize(

    window.innerWidth,

    window.innerHeight

  );


  effect.setSize(

    window.innerWidth,

    window.innerHeight

  );

}


window.addEventListener(

  "resize",

  ajustarPantalla

);


/* =====================================================
   CAMBIO DE ORIENTACIÓN DEL CELULAR
===================================================== */

if (
  screen.orientation
) {


  screen.orientation
    .addEventListener(

      "change",

      ajustarPantalla

    );

}

</script>


</body>

</html>
