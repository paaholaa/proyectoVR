<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <!-- ==========================================
       CONFIGURACIÓN PARA IPHONE / PWA
  =========================================== -->

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover
    "
  >

  <title>Visor VR 360°</title>


  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;

      font-family: Arial, sans-serif;

      touch-action: none;

      overscroll-behavior: none;
    }


    body {

      position: fixed;

      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

    }


    /* ==========================================
       CANVAS THREE.JS
    =========================================== */

    canvas {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      display: block;

      z-index: 1;

    }


    /* ==========================================
       MÁSCARA VR
    =========================================== */

    #vr-mask {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      z-index: 10;

      pointer-events: none;

    }


    .eye-mask {

      position: absolute;

      top: 0;

      width: 50%;
      height: 100%;

      overflow: hidden;

    }


    #eye-left {
      left: 0;
    }


    #eye-right {
      right: 0;
    }


    /* ==========================================
       CÍRCULOS VR
    =========================================== */

    .eye-mask::after {

      content: "";

      position: absolute;

      top: 50%;

      /*
        Tamaño de cada círculo.
      */

      width: min(48vw, 92vh);
      height: min(48vw, 92vh);

      transform: translateY(-50%);

      border-radius: 50%;

      /*
        Oscurece todo lo que está
        fuera del círculo.
      */

      box-shadow:
        0 0 0 200vmax #000;

    }


    /*
      CÍRCULOS JUNTOS.

      Si quieres juntarlos todavía más,
      aumenta 3px.

      Ejemplo:
      5px
      8px
      10px
    */

    #eye-left::after {
      right: -6px;
    }


    #eye-right::after {
      left: -6px;
    }


    /* ==========================================
       BOTÓN INICIAR VR
    =========================================== */

    #start-btn {

      position: fixed;

      left: 50%;

      bottom:
        calc(
          20px +
          env(safe-area-inset-bottom)
        );

      transform:
        translateX(-50%);

      z-index: 100;

      padding:
        14px 26px;

      border: none;

      border-radius: 30px;

      background: #28a745;

      color: #fff;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 4px 15px
        rgba(0,0,0,.8);

      white-space: nowrap;

    }


    /* ==========================================
       MENSAJE
    =========================================== */

    #mensaje {

      position: fixed;

      top:
        calc(
          15px +
          env(safe-area-inset-top)
        );

      left: 50%;

      transform:
        translateX(-50%);

      z-index: 100;

      padding:
        9px 18px;

      border-radius: 20px;

      background:
        rgba(0,0,0,.7);

      color: #fff;

      font-size: 14px;

      text-align: center;

      white-space: nowrap;

      pointer-events: none;

    }


    /* ==========================================
       CELULAR HORIZONTAL
    =========================================== */

    @media (orientation: landscape) {

      .eye-mask::after {

        width:
          min(48vw, 92vh);

        height:
          min(48vw, 92vh);

      }

    }


    /* ==========================================
       CELULAR VERTICAL
    =========================================== */

    @media (orientation: portrait) {

      .eye-mask::after {

        width: 48vw;
        height: 48vw;

      }

    }

  </style>


  <!-- THREE.JS -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
  </script>


  <!-- STEREO EFFECT -->

  <script
    src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/effects/StereoEffect.js">
  </script>

</head>


<body>


  <!-- ==========================================
       DOS CÍRCULOS VR
  =========================================== -->

  <div id="vr-mask">

    <div
      class="eye-mask"
      id="eye-left">
    </div>

    <div
      class="eye-mask"
      id="eye-right">
    </div>

  </div>


  <!-- MENSAJE -->

  <div id="mensaje">
    🥽 Visor VR 360°
  </div>


  <!-- BOTÓN -->

  <button id="start-btn">
    📱 Iniciar VR
  </button>



<script>

/* =====================================================
   COMPROBAR THREE.JS
===================================================== */

if (typeof THREE === "undefined") {

  alert("No se pudo cargar Three.js");

  throw new Error(
    "THREE no está disponible"
  );

}


/* =====================================================
   ESCENA
===================================================== */

const scene =
  new THREE.Scene();


scene.background =
  new THREE.Color(0x000000);


/* =====================================================
   CÁMARA
===================================================== */

const camera =
  new THREE.PerspectiveCamera(

    90,

    window.innerWidth /
    window.innerHeight,

    0.1,

    1000

  );


camera.position.set(
  0,
  0,
  0
);


/* =====================================================
   RENDER
===================================================== */

const renderer =
  new THREE.WebGLRenderer({

    antialias: true

  });


renderer.setPixelRatio(

  Math.min(
    window.devicePixelRatio,
    2
  )

);


renderer.setSize(

  window.innerWidth,
  window.innerHeight

);


renderer.setClearColor(
  0x000000,
  1
);


document.body.appendChild(
  renderer.domElement
);


/* =====================================================
   EFECTO ESTÉREO
===================================================== */

const effect =
  new THREE.StereoEffect(
    renderer
  );


effect.setSize(

  window.innerWidth,
  window.innerHeight

);


/* =====================================================
   CARGAR IMÁGENES
===================================================== */

const loader =
  new THREE.TextureLoader();


function cargarImagen(
  ruta,
  nombre
) {

  return loader.load(

    ruta,

    function () {

      console.log(
        "Imagen cargada:",
        nombre
      );

    },

    undefined,

    function (error) {

      console.error(
        "Error cargando:",
        ruta,
        error
      );

    }

  );

}


/* =====================================================
   6 CARAS
===================================================== */

const texturaPosX =
  cargarImagen(
    "fotos/posx.png",
    "Derecha"
  );


const texturaNegX =
  cargarImagen(
    "fotos/negx.png",
    "Izquierda"
  );


const texturaPosY =
  cargarImagen(
    "fotos/posy.png",
    "Arriba"
  );


const texturaNegY =
  cargarImagen(
    "fotos/negy.png",
    "Abajo"
  );


const texturaPosZ =
  cargarImagen(
    "fotos/posz.png",
    "Frente"
  );


const texturaNegZ =
  cargarImagen(
    "fotos/negz.png",
    "Atrás"
  );


/* =====================================================
   MATERIALES
===================================================== */

const materials = [

  new THREE.MeshBasicMaterial({
    map: texturaPosX,
    side: THREE.BackSide
  }),

  new THREE.MeshBasicMaterial({
    map: texturaNegX,
    side: THREE.BackSide
  }),

  new THREE.MeshBasicMaterial({
    map: texturaPosY,
    side: THREE.BackSide
  }),

  new THREE.MeshBasicMaterial({
    map: texturaNegY,
    side: THREE.BackSide
  }),

  new THREE.MeshBasicMaterial({
    map: texturaPosZ,
    side: THREE.BackSide
  }),

  new THREE.MeshBasicMaterial({
    map: texturaNegZ,
    side: THREE.BackSide
  })

];


/* =====================================================
   CUBO 360
===================================================== */

const geometry =
  new THREE.BoxGeometry(
    100,
    100,
    100
  );


const skybox =
  new THREE.Mesh(
    geometry,
    materials
  );


scene.add(
  skybox
);


/* =====================================================
   CONTROL CON MOUSE
===================================================== */

let mouseDown = false;

let previousX = 0;
let previousY = 0;

let yaw = 0;
let pitch = 0;


document.addEventListener(

  "mousedown",

  function(event) {

    if (gyroActive) {
      return;
    }

    mouseDown = true;

    previousX =
      event.clientX;

    previousY =
      event.clientY;

  }

);


document.addEventListener(

  "mouseup",

  function() {

    mouseDown = false;

  }

);


document.addEventListener(

  "mousemove",

  function(event) {

    if (
      !mouseDown ||
      gyroActive
    ) {

      return;

    }


    const deltaX =
      event.clientX -
      previousX;


    const deltaY =
      event.clientY -
      previousY;


    yaw -=
      deltaX * 0.005;


    pitch -=
      deltaY * 0.005;


    pitch =
      Math.max(

        -Math.PI / 2,

        Math.min(
          Math.PI / 2,
          pitch
        )

      );


    previousX =
      event.clientX;


    previousY =
      event.clientY;

  }

);


/* =====================================================
   CONTROL TÁCTIL
===================================================== */

let touchX = 0;
let touchY = 0;


document.addEventListener(

  "touchstart",

  function(event) {

    if (
      gyroActive ||
      event.touches.length === 0
    ) {

      return;

    }


    touchX =
      event.touches[0].clientX;


    touchY =
      event.touches[0].clientY;

  },

  {
    passive: true
  }

);


document.addEventListener(

  "touchmove",

  function(event) {

    if (
      gyroActive ||
      event.touches.length === 0
    ) {

      return;

    }


    const x =
      event.touches[0].clientX;


    const y =
      event.touches[0].clientY;


    yaw -=
      (x - touchX) *
      0.005;


    pitch -=
      (y - touchY) *
      0.005;


    pitch =
      Math.max(

        -Math.PI / 2,

        Math.min(
          Math.PI / 2,
          pitch
        )

      );


    touchX = x;
    touchY = y;

  },

  {
    passive: true
  }

);


/* =====================================================
   GIROSCOPIO IPHONE / ANDROID
===================================================== */

let gyroActive = false;


const deviceEuler =
  new THREE.Euler();


const deviceQuaternion =
  new THREE.Quaternion();


const screenQuaternion =
  new THREE.Quaternion();


const worldQuaternion =
  new THREE.Quaternion(

    -Math.sqrt(0.5),

    0,

    0,

    Math.sqrt(0.5)

  );


const zee =
  new THREE.Vector3(
    0,
    0,
    1
  );


function setObjectQuaternion(

  quaternion,

  alpha,

  beta,

  gamma,

  orient

) {

  deviceEuler.set(

    beta,

    alpha,

    -gamma,

    "YXZ"

  );


  quaternion.setFromEuler(
    deviceEuler
  );


  quaternion.multiply(
    worldQuaternion
  );


  quaternion.multiply(

    screenQuaternion
      .setFromAxisAngle(
        zee,
        -orient
      )

  );

}


/* =====================================================
   RECIBIR MOVIMIENTO DEL TELÉFONO
===================================================== */

function onDeviceOrientation(
  event
) {

  if (

    event.alpha === null &&
    event.beta === null &&
    event.gamma === null

  ) {

    return;

  }


  gyroActive = true;


  const alpha =

    event.alpha !== null

      ? THREE.MathUtils.degToRad(
          event.alpha
        )

      : 0;


  const beta =

    event.beta !== null

      ? THREE.MathUtils.degToRad(
          event.beta
        )

      : 0;


  const gamma =

    event.gamma !== null

      ? THREE.MathUtils.degToRad(
          event.gamma
        )

      : 0;


  let orientation = 0;


  if (

    screen.orientation &&
    typeof screen.orientation.angle
      === "number"

  ) {

    orientation =
      THREE.MathUtils.degToRad(
        screen.orientation.angle
      );

  }

  else if (

    typeof window.orientation
      === "number"

  ) {

    orientation =
      THREE.MathUtils.degToRad(
        window.orientation
      );

  }


  setObjectQuaternion(

    deviceQuaternion,

    alpha,
    beta,
    gamma,

    orientation

  );


  camera.quaternion.copy(
    deviceQuaternion
  );

}


/* =====================================================
   ACTIVAR GIROSCOPIO
===================================================== */

function activarGiroscopio() {

  window.addEventListener(

    "deviceorientation",

    onDeviceOrientation,

    true

  );


  mensaje.innerHTML =
    "🥽 Mueve el teléfono";


  setTimeout(

    function() {

      mensaje.style.display =
        "none";

    },

    2000

  );

}


/* =====================================================
   BOTÓN INICIAR VR
===================================================== */

const btn =
  document.getElementById(
    "start-btn"
  );


const mensaje =
  document.getElementById(
    "mensaje"
  );


btn.addEventListener(

  "click",

  async function() {


    /* ==========================================
       PERMISO IPHONE
    =========================================== */

    if (

      typeof DeviceOrientationEvent
        !== "undefined"

      &&

      typeof DeviceOrientationEvent
        .requestPermission
        === "function"

    ) {

      try {

        const permiso =

          await DeviceOrientationEvent
            .requestPermission();


        if (
          permiso === "granted"
        ) {

          activarGiroscopio();

        }

        else {

          alert(
            "Debes permitir el acceso al movimiento y orientación."
          );

          return;

        }

      }

      catch(error) {

        console.error(error);

        alert(
          "No se pudo activar el movimiento del iPhone."
        );

        return;

      }

    }

    else {

      activarGiroscopio();

    }


    /* ==========================================
       INTENTAR PANTALLA COMPLETA
    =========================================== */

    try {

      const elemento =
        document.documentElement;


      if (
        elemento.requestFullscreen
      ) {

        await elemento
          .requestFullscreen();

      }

      else if (
        elemento.webkitRequestFullscreen
      ) {

        await elemento
          .webkitRequestFullscreen();

      }

    }

    catch(error) {

      console.log(
        "Fullscreen no disponible en este navegador."
      );

    }


    /* OCULTAR BOTÓN */

    btn.style.display =
      "none";

  }

);


/* =====================================================
   ROTACIÓN CON MOUSE
===================================================== */

const mouseEuler =
  new THREE.Euler(

    0,
    0,
    0,

    "YXZ"

  );


/* =====================================================
   ANIMACIÓN
===================================================== */

function animate() {

  requestAnimationFrame(
    animate
  );


  if (!gyroActive) {

    mouseEuler.set(

      pitch,
      yaw,
      0,

      "YXZ"

    );


    camera.quaternion
      .setFromEuler(
        mouseEuler
      );

  }


  effect.render(
    scene,
    camera
  );

}


animate();


/* =====================================================
   AJUSTAR PANTALLA
===================================================== */

function ajustarPantalla() {

  const ancho =
    window.innerWidth;


  const alto =
    window.innerHeight;


  camera.aspect =
    ancho / alto;


  camera.updateProjectionMatrix();


  renderer.setSize(
    ancho,
    alto
  );


  effect.setSize(
    ancho,
    alto
  );

}


window.addEventListener(

  "resize",

  ajustarPantalla

);


window.addEventListener(

  "orientationchange",

  function() {

    setTimeout(
      ajustarPantalla,
      300
    );

  }

);


if (screen.orientation) {

  screen.orientation
    .addEventListener(

      "change",

      function() {

        setTimeout(
          ajustarPantalla,
          300
        );

      }

    );

}

</script>

</body>

</html>
